name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # worker-configuration.d.ts is committed: it includes secret names from .dev.vars,
      # which CI doesn't have. Regenerate locally with `pnpm exec wrangler types`.
      - run: pnpm typecheck
      - run: pnpm test
      - name: Route audit (warning-only)
        run: node scripts/audit-routes.ts
        continue-on-error: true
      - name: Known secret patterns (Meta tokens, private keys)
        run: |
          if git grep -nE 'EAA[A-Za-z0-9]{40,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- ':!test/fixtures'; then
            echo "possible secret committed"; exit 1
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
